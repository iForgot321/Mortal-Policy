# D31's actor-size curves (experiments/size-curves.md; D65, D68), run curves-b12-s3: P1 + K2 on obs v5 from
# b12c256's EMA weights (students-s1, 8f8031f4…), against three frozen copies of it.
# Only if the reading is close (the third seed, batch 3).
# Identical to k2-v5.toml except:
#   - workdir/curves-b12-s3/ paths and control.seed = 3;
#   - [resnet] b12c256; the student as the opponent (baseline.train/test) and the first anchor;
#   - the soak's learner settings (dataset.num_workers 4, control.num_threads 4);
#   - [policy.kl_anchor]: D68's controller (start 0.11, tolerance 1.25, factor 1.5, floor 0.01,
#     ceiling 10, hold 100 windows), re-anchored at each stage by the watcher.
#
# Init: the size's B0 `full` without its run clock (tools/fleet/stage_init.py), so the schedules
#   start at t = 0. The B0: this size's seed-1 config with --set critic.warmup=true, from
#   `stage_init.py --from-policy` of the student.
# Run with tools/fleet/fleet.py (experiments/size-curves.md has the commands).
#
# Frozen inputs: the student above, GRP-v2 grp-v2-frozen.pth (db28beac…).

[control]
version = 5
online = true
# D65, D68: the run's seed (the learner's data order and loader workers; the actors' games
# draw their own keys)
seed = 3

state_file = '/home/iforgot/projects/Mortal-Policy/workdir/curves-b12-s3/mortal.pth'
best_state_file = '/home/iforgot/projects/Mortal-Policy/workdir/curves-b12-s3/best.pth'
tensorboard_dir = '/home/iforgot/projects/Mortal-Policy/workdir/curves-b12-s3/tb'

device = 'cuda:0'
enable_cudnn_benchmark = true
enable_amp = true
enable_compile = true
# torch CPU threads in the trainer; the soak's learner settings (experiments/fleet-soak.md)
num_threads = 4

batch_size = 512
opt_step_every = 1

save_every = 400
# test_play proves nothing (no verdict); evaluation is the lab's job. Also, the online
# trainer exits after test_play and main() respawns it.
test_every = 100_000_000
submit_every = 400
# unused with ratio_reference = 'stored'
old_update_every = 400

[train_play.default]
games = 800
log_dir = '/home/iforgot/projects/Mortal-Policy/workdir/curves-b12-s3/train_play'
# behaviour sidecars (D46): log_dir + '_behaviour'
repeats = 1
explore_rate = 1.0

[test_play]
games = 1000
log_dir = '/home/iforgot/projects/Mortal-Policy/workdir/curves-b12-s3/test_play'

[dataset]
# per-seat ordered trajectories joined to their behaviour sidecars (rl_dataset.py)
ordered = true
globs = []
file_index = ''
player_names_files = []
# 1v3 logs carry one trainee seat: ~158 decisions, ~11 MB of fp16 obs per log
file_batch_size = 50
reserve_ratio = 0.0
num_workers = 4
num_epochs = 1
enable_augmentation = false
augmented_first = false
obs_fp16 = true

[resnet]
conv_channels = 256
num_blocks = 12

[env]
# u x 100 (D2)
pts = [90.0, 50.0, -10.0, -130.0]
# the ordered dataset always uses fixed units; recorded for the checkpoint
reward_standardization = false

[policy]
ratio_reference = 'stored'
horizon = 'H'
advantage_norm = true
entropy_weight = 1e-3
clip_ratio = 0.2
dual_clip = 3.0

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.0
max_grad_norm = 0.5

[optim.scheduler]
# constant: peak = final
peak = 2e-5
final = 2e-5
warm_up_steps = 0
max_steps = 0

[critic]
enabled = true
# B0: the policy stays frozen and only the critic trains
warmup = false
conv_channels = 128
num_blocks = 8
gamma = 1.0
gae_lambda = 0.95
max_grad_norm = 1.0

[critic.optim]
weight_decay = 0.0

[critic.optim.scheduler]
# constant (peak = final); chosen by experiments/k1-lr-check.md
peak = 1e-4
final = 1e-4
warm_up_steps = 0
max_steps = 0

[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = '/home/iforgot/projects/Mortal-Policy/workdir/secure/runs/students-s1/box/students-s1/ema-b12c256.pth'

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = '/home/iforgot/projects/Mortal-Policy/workdir/secure/runs/students-s1/box/students-s1/ema-b12c256.pth'

[online]
history_window = 50
# actor-side compile; the engine's batch sizes vary
enable_compile = false

[online.remote]
host = '127.0.0.1'
port = 5000

[online.server]
buffer_dir = '/home/iforgot/projects/Mortal-Policy/workdir/curves-b12-s3/buffer'
drain_dir = '/home/iforgot/projects/Mortal-Policy/workdir/curves-b12-s3/drain'
# sidecars: buffer_dir + '_behaviour', drain_dir + '_behaviour'
sample_reuse_rate = 0
sample_reuse_threshold = 0
capacity = 1600
force_sequential = false

[grp]
state_file = '/home/iforgot/projects/Mortal-Policy/workdir/grp-v2/grp-v2-frozen.pth'

[grp.network]
hidden_size = 64
num_layers = 2

# D68's anchor (experiments/size-curves.md): stage 1 anchors to the starting student (the default,
# baseline.train.state_file); the watcher re-anchors to each 72-box-hour snapshot (fleet.py watch
# --reanchor), and the coefficient carries across (mortal/kl_anchor.py)
[policy.kl_anchor]
enabled = true
mode = 'adaptive'
coef = 0.11
target = 0.02
target_growth = 0.0
adapt_every = 400
# no cut before the KL first reaches target / tolerance or 40K steps pass, at the start and after
# each re-anchor (the KL starts again from ≈ 0; experiments/size-curves.md, the user 2026-11-18)
hold_windows = 100
tolerance = 1.25
factor = 1.5
coef_min = 0.01
coef_max = 10.0

# k2.toml's power laws, on the run clock (the curves' inits have none: tools/fleet/stage_init.py)
[policy.schedules]
t0 = 100_000
lr = { v0 = 2e-5, p = 0.3, lo = 5e-6 }
clip_ratio = { v0 = 0.2, p = 0.2, lo = 0.1 }
entropy_weight = { v0 = 1e-3, p = 0.5, lo = 1e-4 }
