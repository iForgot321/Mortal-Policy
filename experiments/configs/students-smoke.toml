# The students' smoke run on the workstation (experiments/students-s1.md): students-s1.toml with the real
# teachers, the real student sizes and batch 2048, on 3,000 train files, for 1,500 steps; 2 loader
# workers (RAM), 20 validation logs every 1,000 steps, a checkpoint every 10 min. Generated from
# students-s1.toml; only the lines below the "smoke:" comments differ.
#
#   cd mortal && MJ_DATA=~/mj-data MORTAL_CFG=../experiments/configs/students-smoke.toml python train_students.py
[control]
version = 5
seed = 1
# smoke:
run_dir = '/home/iforgot/projects/Mortal-Policy/workdir/students-smoke/run'
device = 'cuda:0'
enable_cudnn_benchmark = true
enable_amp = true
enable_compile = true
batch_size = 2048
# smoke:
log_every = 100
# smoke:
save_minutes = 10

[dataset]
# smoke:
file_index = '/home/iforgot/projects/Mortal-Policy/workdir/students-smoke/index.pth'
masks_file = '${MJ_DATA}/splits/masks.jsonl'
data_root = '${MJ_DATA}'
# every worker's slice spans the whole window (the teachers' 'sorted' gave one era per worker)
file_order = 'shuffled'
val_split = 'heldout_game'
# inside the train window (47 of the teachers' 200 validation logs were from 2009-2014)
val_start = '2015-01-01'
# smoke:
val_games = 20
# smoke:
val_every = 1_000
file_batch_size = 20
# smoke:
num_workers = 2
num_epochs = 1
enable_augmentation = true
augmented_first = false

[teachers]
# D67: the real EMA weights (experiments/teacher-ema-export.md); BC s1 is the best single teacher
files = [
    '/home/iforgot/projects/Mortal-Policy/workdir/teacher/teacher-bc-s1/ema-from-state.pth',
    '/home/iforgot/projects/Mortal-Policy/workdir/teacher/teacher-awr-s1/ema-from-state.pth',
]
sha256 = [
    '59d9463626125707f329355d515aa27ac2572d385906e336694047bd4b5f586f',
    '75e55855c2effa1ca52bb380f55cd6353064c43ceb92fd1330d045829a47c4b8',
]

[students.b8c192]
conv_channels = 192
num_blocks = 8
loss = 'distill'

[students.b12c256]
conv_channels = 256
num_blocks = 12
loss = 'distill'

[students.b16c256]
conv_channels = 256
num_blocks = 16
loss = 'distill'

# D66: the same shape, init and stream as b8c192, trained on the labels (BC) with no teacher term
[students.control-b8c192]
conv_channels = 192
num_blocks = 8
loss = 'labels'

[distill]
w_hard = 0.1
w_placement = 0.5
w_kyoku_delta = 0.5
w_aux = 0.2

# the students' heads, and the control's loss (the teachers' loss, 04 §5)
[teacher]
hidden = 256
detach = false
w_placement = 0.5
w_kyoku_delta = 0.5
w_aux = 0.2
huber_delta = 1.0

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 1.0
ema_decay = 0.999

[optim.scheduler]
# the quick students' peak for these sizes (pilot-qs-a.toml, sp-nosp-a.toml)
peak = 3e-4
final = 1e-5
# smoke:
warm_up_steps = 500
# smoke:
max_steps = 1_500

[env]
pts = [90.0, 50.0, -10.0, -130.0]

[grp]
state_file = '/home/iforgot/projects/Mortal-Policy/workdir/grp-v2/grp-v2-frozen.pth'

[grp.network]
hidden_size = 64
num_layers = 2
