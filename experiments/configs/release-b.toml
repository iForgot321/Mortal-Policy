# D64's anchor-release pilot, candidate B (re-anchor): experiments/anchor-release.md, pre-registered
# 2026-11-12. P1 + K2 as k2.toml ran it (run k2b), continued from k2b full for 48 h on a learner and
# 2 actors, with pilot A at the table as before. Identical to k2.toml except:
#   - workdir/release-b/ paths;
#   - the learner check's settings, as the soak ran them by override (experiments/fleet-soak.md):
#     dataset.num_workers 4, control.num_threads 4;
#   - [policy.schedules]: the LR, clip and entropy weight held constant at the soak's values, so
#     the anchor is the only thing that differs from the soak (the run clock restarts at 0);
#   - [policy.kl_anchor]: the anchor is k2b full itself (state_file), target 0.02 nats, constant;
#     the controller starts as k2b's did.
#
# Init: workdir/release/init-b.pth = k2b full without its run clock and its anchor state
#   (tools/fleet/stage_init.py --new-anchor).
# Run with tools/fleet/fleet.py (the commands are in experiments/anchor-release.md).
#
# Frozen inputs: pilot A pilot-qs-a-final.pth (15121432…), GRP-v2 grp-v2-frozen.pth (db28beac…),
# k2b full workdir/fleet/runs/k2b/snapshots/full.pth (f5a22c5c…).

[control]
version = 4
online = true

state_file = '/home/iforgot/projects/Mortal-Policy/workdir/release-b/mortal.pth'
best_state_file = '/home/iforgot/projects/Mortal-Policy/workdir/release-b/best.pth'
tensorboard_dir = '/home/iforgot/projects/Mortal-Policy/workdir/release-b/tb'

device = 'cuda:0'
enable_cudnn_benchmark = true
enable_amp = true
enable_compile = true
# torch CPU threads in the trainer (0: torch's default); set by the learner check (experiments/p1.md)
num_threads = 4

batch_size = 512
opt_step_every = 1

save_every = 400
# test_play proves nothing (no verdict); evaluation is the lab's job. Also, the online
# trainer exits after test_play and main() respawns it.
test_every = 100_000_000
submit_every = 400
# unused with ratio_reference = 'stored'
old_update_every = 400

[train_play.default]
games = 800
log_dir = '/home/iforgot/projects/Mortal-Policy/workdir/release-b/train_play'
# behaviour sidecars (D46): log_dir + '_behaviour'
repeats = 1
explore_rate = 1.0

[test_play]
games = 1000
log_dir = '/home/iforgot/projects/Mortal-Policy/workdir/release-b/test_play'

[dataset]
# per-seat ordered trajectories joined to their behaviour sidecars (rl_dataset.py)
ordered = true
globs = []
file_index = ''
player_names_files = []
# 1v3 logs carry one trainee seat: ~158 decisions, ~11 MB of fp16 obs per log
file_batch_size = 50
reserve_ratio = 0.0
num_workers = 4
num_epochs = 1
enable_augmentation = false
augmented_first = false
obs_fp16 = true

[resnet]
conv_channels = 192
num_blocks = 8

[env]
# u x 100 (D2)
pts = [90.0, 50.0, -10.0, -130.0]
# the ordered dataset always uses fixed units; recorded for the checkpoint
reward_standardization = false

[policy]
ratio_reference = 'stored'
horizon = 'H'
advantage_norm = true
entropy_weight = 1e-3
clip_ratio = 0.2
dual_clip = 3.0

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.0
max_grad_norm = 0.5

[optim.scheduler]
# constant: peak = final
peak = 2e-5
final = 2e-5
warm_up_steps = 0
max_steps = 0

[critic]
enabled = true
# B0: the policy stays frozen and only the critic trains
warmup = false
conv_channels = 128
num_blocks = 8
gamma = 1.0
gae_lambda = 0.95
max_grad_norm = 1.0

[critic.optim]
weight_decay = 0.0

[critic.optim.scheduler]
# constant (peak = final); chosen by experiments/k1-lr-check.md
peak = 1e-4
final = 1e-4
warm_up_steps = 0
max_steps = 0

[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = '/home/iforgot/projects/Mortal-Policy/workdir/pilot/qs-a/pilot-qs-a-final.pth'

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = '/home/iforgot/projects/Mortal-Policy/workdir/pilot/qs-a/pilot-qs-a-final.pth'

[online]
history_window = 50
# actor-side compile; the engine's batch sizes vary
enable_compile = false

[online.remote]
host = '127.0.0.1'
port = 5000

[online.server]
buffer_dir = '/home/iforgot/projects/Mortal-Policy/workdir/release-b/buffer'
drain_dir = '/home/iforgot/projects/Mortal-Policy/workdir/release-b/drain'
# sidecars: buffer_dir + '_behaviour', drain_dir + '_behaviour'
sample_reuse_rate = 0
sample_reuse_threshold = 0
capacity = 1600
force_sequential = false

[grp]
state_file = '/home/iforgot/projects/Mortal-Policy/workdir/grp-v2/grp-v2-frozen.pth'

[grp.network]
hidden_size = 64
num_layers = 2

# K2 (05 §5.1, D59) as the pilot sets it: the KL anchor and the schedules.
[policy.kl_anchor]
enabled = true
# pi_SL is k2b full, the policy this run starts from, not the table's opponent (pilot A)
state_file = '/home/iforgot/projects/Mortal-Policy/workdir/fleet/runs/k2b/snapshots/full.pth'
mode = 'adaptive'
# the controller as k2.toml's: the init carries no anchor state, so it starts here
coef = 0.1
target = 0.02
target_growth = 0.0
adapt_every = 400
hold_windows = 5
tolerance = 1.5
factor = 1.5
coef_min = 0.01
coef_max = 10.0

[policy.schedules]
# Constants (p = 0) at the soak's values. k2.toml's power laws ran from 6.7e-6 to 6.0e-6 (LR) and
# from 1.6e-4 to 1.4e-4 (entropy weight) over the soak, with the clip at its 0.1 floor.
t0 = 100_000
lr = { v0 = 6.4e-6, p = 0.0 }
clip_ratio = { v0 = 0.1, p = 0.0 }
entropy_weight = { v0 = 1.5e-4, p = 0.0 }
