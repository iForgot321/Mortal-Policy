# Pilot quick student A (D41; 04 §7): b8c192 BC, seed 1. Twin of pilot-qs-b.toml,
# which differs ONLY in [control] seed and the workdir paths. Together they give
# the A/A' noise floor (02 §6) and the P0/P1 policy initializations (05 §2).
#
# Run from mortal/:  MORTAL_CFG=../experiments/configs/pilot-qs-a.toml python train_offline_phase1.py
# Data: workdir/pilot/quick500k.pth, built by
#   python tools/data/make_index.py phase1 workdir/pilot/quick500k.pth --lists train_E train_O \
#       --from 2020-01-01 --to 2025-06-30 --subset 500000 --subset-key quick500k
# Notes: experiments/pilot-quick-students.md

[control]
version = 4
online = false
seed = 1

state_file = '/home/iforgot/projects/Mortal-Policy/workdir/pilot/qs-a/mortal.pth'
best_state_file = '/home/iforgot/projects/Mortal-Policy/workdir/pilot/qs-a/best.pth'
tensorboard_dir = '/home/iforgot/projects/Mortal-Policy/workdir/pilot/qs-a/tb'

device = 'cuda:0'
enable_cudnn_benchmark = true
enable_amp = true
enable_compile = true

batch_size = 2048
opt_step_every = 1

save_every = 2000
# test_play vs a random-init net proves nothing; evaluation is the lab's job
test_every = 100_000_000
submit_every = 400
old_update_every = 400

[test_play]
games = 1000
log_dir = '/home/iforgot/projects/Mortal-Policy/workdir/pilot/qs-a/test_play'

[dataset]
globs = []
file_index = '/home/iforgot/projects/Mortal-Policy/workdir/pilot/quick500k.pth'
masks_file = '/home/iforgot/mj-data/splits/masks.jsonl'
# 2 workers: ~4.2K samples/s, peak ~8.6 GB (measured 2026-10-03). The loader already uses
# all cores via rayon, so 4 workers were SLOWER (3.0K/s) and peaked at 13 GB: near OOM.
file_batch_size = 20
reserve_ratio = 0.0
num_workers = 2
player_names_files = []
num_epochs = 1
enable_augmentation = false
augmented_first = false
obs_fp16 = true

[resnet]
conv_channels = 192
num_blocks = 8

[env]
# u x 100 (D2); unused by BC, recorded for the checkpoint
pts = [90.0, 50.0, -10.0, -130.0]

[policy]
objective = 'bc'
awr_beta = 1.0
awr_clip = 100
entropy_weight = 1e-3
clip_ratio = 0.2
dual_clip = 3.0

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 1.0

[optim.scheduler]
peak = 3e-4
final = 1e-5
warm_up_steps = 2000
# = decisions in the subset after masks / batch_size (set from the measured count)
max_steps = 158000  # 323.6M usable decisions (328.3M minus ~1.4% Q6/Q8 masked) / 2048

[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = '/home/iforgot/projects/Mortal-Policy/workdir/phase1/baseline.pth'

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = '/home/iforgot/projects/Mortal-Policy/workdir/phase1/baseline.pth'

[online]
history_window = 50
enable_compile = false

[online.remote]
host = '127.0.0.1'
port = 5000

[online.server]
buffer_dir = '/home/iforgot/projects/Mortal-Policy/workdir/online/buffer'
drain_dir = '/home/iforgot/projects/Mortal-Policy/workdir/online/drain'
sample_reuse_rate = 0
sample_reuse_threshold = 0
capacity = 1600
force_sequential = false

[grp]
state_file = '/home/iforgot/projects/Mortal-Policy/workdir/grp-v2/grp-v2-frozen.pth'

[grp.network]
hidden_size = 64
num_layers = 2
