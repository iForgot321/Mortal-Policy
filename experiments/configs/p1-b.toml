# Arm P1, seed 2 (05 §2.1, D52, D53): identical to p1.toml except that it starts from pilot B
# and plays 1v3 against frozen pilot B (each arm-seed plays against its own initialization,
# 05 §2.2), with its own paths (workdir/p1-b/). Horizon H and the K1 critic as in p1.toml.
#
# B0 warm-up first (D53): the same config with critic.warmup = true, on pilot B's games, from a
# fresh critic; its compute is outside the 432 box-hours (experiments/p1.md).
#
# Init: COPY pilot B into the run directory; never write into workdir/pilot/:
#   mkdir -p workdir/p1-b && cp workdir/pilot/qs-b/pilot-qs-b-final.pth workdir/p1-b/mortal.pth && chmod u+w workdir/p1-b/mortal.pth
#
# Frozen inputs: pilot B pilot-qs-b-final.pth (b267c026…), GRP-v2 grp-v2-frozen.pth (db28beac…).

[control]
version = 4
online = true

state_file = '/home/iforgot/projects/Mortal-Policy/workdir/p1-b/mortal.pth'
best_state_file = '/home/iforgot/projects/Mortal-Policy/workdir/p1-b/best.pth'
tensorboard_dir = '/home/iforgot/projects/Mortal-Policy/workdir/p1-b/tb'

device = 'cuda:0'
enable_cudnn_benchmark = true
enable_amp = true
enable_compile = true

batch_size = 512
opt_step_every = 1

save_every = 400
# test_play proves nothing (no verdict); evaluation is the lab's job. Also, the online
# trainer exits after test_play and main() respawns it.
test_every = 100_000_000
submit_every = 400
# unused with ratio_reference = 'stored'
old_update_every = 400

[train_play.default]
games = 800
log_dir = '/home/iforgot/projects/Mortal-Policy/workdir/p1-b/train_play'
# behaviour sidecars (D46): log_dir + '_behaviour'
repeats = 1
explore_rate = 1.0

[test_play]
games = 1000
log_dir = '/home/iforgot/projects/Mortal-Policy/workdir/p1-b/test_play'

[dataset]
# per-seat ordered trajectories joined to their behaviour sidecars (rl_dataset.py)
ordered = true
globs = []
file_index = ''
player_names_files = []
# 1v3 logs carry one trainee seat: ~158 decisions, ~11 MB of fp16 obs per log
file_batch_size = 50
reserve_ratio = 0.0
num_workers = 2
num_epochs = 1
enable_augmentation = false
augmented_first = false
obs_fp16 = true

[resnet]
conv_channels = 192
num_blocks = 8

[env]
# u x 100 (D2)
pts = [90.0, 50.0, -10.0, -130.0]
# the ordered dataset always uses fixed units; recorded for the checkpoint
reward_standardization = false

[policy]
ratio_reference = 'stored'
horizon = 'H'
advantage_norm = true
entropy_weight = 1e-3
clip_ratio = 0.2
dual_clip = 3.0

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.0
max_grad_norm = 0.5

[optim.scheduler]
# constant: peak = final
peak = 2e-5
final = 2e-5
warm_up_steps = 0
max_steps = 0

[critic]
enabled = true
# B0: the policy stays frozen and only the critic trains
warmup = false
conv_channels = 128
num_blocks = 8
gamma = 1.0
gae_lambda = 0.95
max_grad_norm = 1.0

[critic.optim]
weight_decay = 0.0

[critic.optim.scheduler]
# constant (peak = final); chosen by experiments/k1-lr-check.md
peak = 1e-4
final = 1e-4
warm_up_steps = 0
max_steps = 0

[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = '/home/iforgot/projects/Mortal-Policy/workdir/pilot/qs-b/pilot-qs-b-final.pth'

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = '/home/iforgot/projects/Mortal-Policy/workdir/pilot/qs-b/pilot-qs-b-final.pth'

[online]
history_window = 50
# actor-side compile; the engine's batch sizes vary
enable_compile = false

[online.remote]
host = '127.0.0.1'
port = 5000

[online.server]
buffer_dir = '/home/iforgot/projects/Mortal-Policy/workdir/p1-b/buffer'
drain_dir = '/home/iforgot/projects/Mortal-Policy/workdir/p1-b/drain'
# sidecars: buffer_dir + '_behaviour', drain_dir + '_behaviour'
sample_reuse_rate = 0
sample_reuse_threshold = 0
capacity = 1600
force_sequential = false

[grp]
state_file = '/home/iforgot/projects/Mortal-Policy/workdir/grp-v2/grp-v2-frozen.pth'

[grp.network]
hidden_size = 64
num_layers = 2
