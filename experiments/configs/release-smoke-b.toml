# Local smoke of D64's anchor-release pilot, candidate B (experiments/anchor-release.md): server,
# trainer and client on the workstation, from workdir/release/init-b.pth. Plumbing, not an
# experiment: no registry rows, no strength claims. k2-smoke.toml with workdir/release-smoke-b/
# paths and release-b.toml's anchor and schedules, the controller acting every 5 steps.
#
# Init: mkdir -p workdir/release-smoke-b && cp workdir/release/init-b.pth workdir/release-smoke-b/mortal.pth && chmod u+w workdir/release-smoke-b/mortal.pth

[control]
version = 4
online = true

state_file = '/home/iforgot/projects/Mortal-Policy/workdir/release-smoke-b/mortal.pth'
best_state_file = '/home/iforgot/projects/Mortal-Policy/workdir/release-smoke-b/best.pth'
tensorboard_dir = '/home/iforgot/projects/Mortal-Policy/workdir/release-smoke-b/tb'

device = 'cuda:0'
enable_cudnn_benchmark = true
enable_amp = true
enable_compile = true

batch_size = 512
opt_step_every = 1

save_every = 5
# test_play proves nothing (no verdict); evaluation is the lab's job. Also, the online
# trainer exits after test_play and main() respawns it.
test_every = 100_000_000
submit_every = 5
# unused with ratio_reference = 'stored'
old_update_every = 400

[train_play.default]
games = 32
log_dir = '/home/iforgot/projects/Mortal-Policy/workdir/release-smoke-b/train_play'
# behaviour sidecars (D46): log_dir + '_behaviour'
repeats = 1
explore_rate = 1.0

[test_play]
games = 1000
log_dir = '/home/iforgot/projects/Mortal-Policy/workdir/release-smoke-b/test_play'

[dataset]
# per-seat ordered trajectories joined to their behaviour sidecars (rl_dataset.py)
ordered = true
globs = []
file_index = ''
player_names_files = []
# 1v3 logs carry one trainee seat: ~158 decisions, ~11 MB of fp16 obs per log
file_batch_size = 8
reserve_ratio = 0.0
num_workers = 1
num_epochs = 1
enable_augmentation = false
augmented_first = false
obs_fp16 = true

[resnet]
conv_channels = 192
num_blocks = 8

[env]
# u x 100 (D2)
pts = [90.0, 50.0, -10.0, -130.0]
# the ordered dataset always uses fixed units; recorded for the checkpoint
reward_standardization = false

[policy]
ratio_reference = 'stored'
horizon = 'H'
advantage_norm = true
entropy_weight = 1e-3
clip_ratio = 0.2
dual_clip = 3.0

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.0
max_grad_norm = 0.5

[optim.scheduler]
# constant: peak = final
peak = 2e-5
final = 2e-5
warm_up_steps = 0
max_steps = 0

[critic]
enabled = true
# B0: the policy stays frozen and only the critic trains
warmup = false
conv_channels = 128
num_blocks = 8
gamma = 1.0
gae_lambda = 0.95
max_grad_norm = 1.0

[critic.optim]
weight_decay = 0.0

[critic.optim.scheduler]
peak = 1e-4
final = 1e-4
warm_up_steps = 0
max_steps = 0

[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = '/home/iforgot/projects/Mortal-Policy/workdir/pilot/qs-a/pilot-qs-a-final.pth'

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = '/home/iforgot/projects/Mortal-Policy/workdir/pilot/qs-a/pilot-qs-a-final.pth'

[online]
history_window = 50
# actor-side compile; the engine's batch sizes vary
enable_compile = false

[online.remote]
host = '127.0.0.1'
port = 5003

[online.server]
buffer_dir = '/home/iforgot/projects/Mortal-Policy/workdir/release-smoke-b/buffer'
drain_dir = '/home/iforgot/projects/Mortal-Policy/workdir/release-smoke-b/drain'
# sidecars: buffer_dir + '_behaviour', drain_dir + '_behaviour'
sample_reuse_rate = 0
sample_reuse_threshold = 0
capacity = 32
force_sequential = true

[grp]
state_file = '/home/iforgot/projects/Mortal-Policy/workdir/grp-v2/grp-v2-frozen.pth'

[grp.network]
hidden_size = 64
num_layers = 2

[policy.kl_anchor]
enabled = true
state_file = '/home/iforgot/projects/Mortal-Policy/workdir/fleet/runs/k2b/snapshots/full.pth'
mode = 'adaptive'
coef = 0.1
target = 0.02
target_growth = 0.0
adapt_every = 5
hold_windows = 5
tolerance = 1.5
factor = 1.5
coef_min = 0.01
coef_max = 10.0

[policy.schedules]
t0 = 100_000
lr = { v0 = 6.4e-6, p = 0.0 }
clip_ratio = { v0 = 0.1, p = 0.0 }
entropy_weight = { v0 = 1.5e-4, p = 0.0 }
